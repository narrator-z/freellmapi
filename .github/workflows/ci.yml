name: CI & Docker

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/freellmapi

jobs:
  # ── Step 1: Test & build ──────────────────────────────────────────
  # If this fails, the Docker build jobs never start.
  test:
    name: Test & build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check migration round trip
        run: npm run test:migrations

      - name: Run tests
        run: npm test
        env:
          SKIP_NETWORK_TESTS: 1

      - name: Build workspaces
        run: npm run build

  # ── Step 2: Docker build (main/tag only, after tests pass) ────────
  docker-build:
    name: Docker (${{ matrix.platform }})
    needs: [test]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4
        with:
          # Use the docker daemon's built-in BuildKit instead of the
          # docker-container driver. The container driver pulls
          # moby/buildkit:buildx-stable-1 from Docker Hub, which intermittently
          # returns 502 Bad Gateway on GitHub-hosted runners and fails the whole
          # pipeline before any build step runs. The docker driver needs no
          # external image pull and is fine for single-platform native builds
          # (each matrix entry runs on its native arch runner).
          driver: docker

      - name: Platform slug
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          # The docker driver does NOT support push-by-digest, so each platform
          # is pushed to its own per-arch tag. The docker-merge job below combines
          # them into a single multi-arch manifest via `imagetools create`.
          tags: ${{ env.IMAGE }}:latest-${{ env.PLATFORM_PAIR }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── Step 3: Merge multi-arch manifest ──────────────────────────────
  docker-merge:
    name: Merge manifest and push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: docker/setup-buildx-action@v4
        with:
          # Same rationale as the docker-build job: avoid pulling
          # moby/buildkit:buildx-stable-1 (502 Bad Gateway). The merge step only
          # uses `docker buildx imagetools create/inspect`, which talk to the
          # registry API and work fine with the docker driver.
          driver: docker

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${IMAGE}:latest-linux-amd64" "${IMAGE}:latest-linux-arm64"

      - name: Inspect image
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
